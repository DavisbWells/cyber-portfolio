<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Login — Cyber Ops</title>
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co; frame-ancestors 'none';">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
  <style>
    /* ── Full-height centering stage ─────────────────────────── */
    .login-stage {
      min-height: calc(100vh - var(--nav-h));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--sp-8) var(--sp-4);
    }

    /* ── Inner block: heading + green panel + back link ──────── */
    .login-block {
      width: 100%;
      max-width: 460px;
      text-align: center;
      animation: fade-in-up 0.55s cubic-bezier(0.4, 0, 0.2, 1) both;
    }

    /* ── Heading above the panel ─────────────────────────────── */
    .login-heading {
      margin-bottom: var(--sp-6);
      animation: fade-in-up 0.5s cubic-bezier(0.4, 0, 0.2, 1) 0.10s both;
    }
    .login-heading h1 {
      font-size: 2rem;
      margin-bottom: var(--sp-2);
    }
    .login-heading .page-cmd {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .login-heading .page-cmd::before {
      content: '$ ';
      color: var(--green);
    }

    /* ── Green rectangle panel ───────────────────────────────── */
    .login-panel {
      background: rgba(0, 255, 136, 0.13);
      border: 1px solid var(--green);
      border-radius: var(--radius-xl);
      padding: 2.5rem 2.25rem;
      box-shadow: 0 0 32px rgba(0, 255, 136, 0.12);
      animation: fade-in-up 0.55s cubic-bezier(0.4, 0, 0.2, 1) 0.18s both,
                 glow-pulse 4s ease-in-out 0.7s infinite;
    }

    /* ── Staggered form elements ─────────────────────────────── */
    .form-group,
    .login-error,
    .btn-login {
      animation: fade-in-up 0.5s cubic-bezier(0.4, 0, 0.2, 1) both;
    }
    .login-error               { animation-delay: 0.24s; }
    .form-group:nth-of-type(1) { animation-delay: 0.30s; }
    .form-group:nth-of-type(2) { animation-delay: 0.38s; }
    .btn-login                 { animation-delay: 0.46s; }

    /* ── Form fields ─────────────────────────────────────────── */
    .form-group {
      margin-bottom: 1.25rem;
      text-align: left;
    }
    .form-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-primary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
    }
    .form-group input {
      width: 100%;
      background: var(--bg-secondary);
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 0.95rem;
      padding: 11px 14px;
      transition: border-color var(--t-fast), box-shadow var(--t-fast), background var(--t-fast);
      outline: none;
    }
    .form-group input:focus {
      background: #151f2e;
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.15);
    }
    .form-group input::placeholder { color: var(--text-dim); }

    /* ── Error block ─────────────────────────────────────────── */
    .login-error {
      background: rgba(239, 68, 68, 0.10);
      border: 1px solid rgba(239, 68, 68, 0.30);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 0.85rem;
      color: var(--red);
      margin-bottom: 1.25rem;
      text-align: left;
      display: none;
    }
    .login-error.visible { display: block; }

    /* ── Submit button ───────────────────────────────────────── */
    .btn-login {
      width: 100%;
      justify-content: center;
      margin-top: 0.25rem;
    }

    /* ── Back link below panel ───────────────────────────────── */
    .login-back {
      display: block;
      margin-top: var(--sp-5);
      font-size: 0.82rem;
      color: var(--text-muted);
      animation: fade-in-up 0.5s cubic-bezier(0.4, 0, 0.2, 1) 0.54s both;
    }
    .login-back a { color: var(--text-muted); text-decoration: none; }
    .login-back a:hover { color: var(--green); }
  </style>
</head>
<body data-page="login">

  <!-- ── Navigation ──────────────────────────────────────────── -->
  <nav class="nav" role="navigation" aria-label="Main navigation">
    <div class="nav-inner">
      <a href="../index.html" class="nav-logo" aria-label="Home">
        <span class="bracket">[</span>Davis Wells<span class="bracket">]</span>
      </a>
      <ul class="nav-links" role="list">
        <li><a href="../index.html">Home</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="certifications.html">Certifications</a></li>
        <li><a href="labs.html">Labs</a></li>
        <li><a href="homelab.html">Homelab</a></li>
        <li><a href="resume.html">Resume</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="login.html" class="active">Admin</a></li>
      </ul>
      <div class="nav-status" aria-label="System status: operational">
        <span class="status-dot" aria-hidden="true"></span>
        Systems Operational
      </div>
      <button class="nav-hamburger" aria-label="Toggle mobile menu" aria-expanded="false" aria-controls="mobile-nav">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- Mobile Navigation -->
  <nav id="mobile-nav" class="nav-mobile" aria-label="Mobile navigation">
    <a href="../index.html">Home</a>
    <a href="projects.html">Projects</a>
    <a href="certifications.html">Certifications</a>
    <a href="labs.html">Labs</a>
    <a href="homelab.html">Homelab</a>
    <a href="resume.html">Resume</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="login.html">Admin</a>
  </nav>

  <main>
    <div class="login-stage">
      <div class="login-block">

        <!-- Heading -->
        <div class="login-heading">
          <h1>Admin Login</h1>
          <div class="page-cmd">sudo admin --authenticate</div>
        </div>

        <!-- Green rectangle panel -->
        <div class="login-panel">

          <div class="login-error" id="login-error" role="alert" aria-live="polite"></div>

          <form id="login-form" novalidate>
            <div class="form-group">
              <label for="email">Email</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                autocomplete="email"
                required>
            </div>

            <div class="form-group">
              <label for="password">Password</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="••••••••"
                autocomplete="current-password"
                required>
            </div>

            <button type="submit" class="btn btn-primary btn-login" id="submit-btn">
              Sign In
            </button>
          </form>

        </div>

        <!-- Back link sits outside the green panel -->
        <div class="login-back">
          <a href="../index.html">&#8592; Back to portfolio</a>
        </div>

      </div>
    </div>
  </main>

  <script src="../config.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/login.js"></script>

</body>
</html>
