  <link rel="stylesheet" href="../assets/css/animations.css">
  <style>
    /* ── Centered card wrapper ───────────────────────────────── */
    .login-center {
      display: flex;
      justify-content: center;
      padding: var(--sp-12) var(--sp-4) var(--sp-16);
    }

    /* ── Card ────────────────────────────────────────────────── */
    .login-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--green-border);
      border-radius: var(--radius-xl);
      padding: 2.75rem 2.5rem;
      box-shadow: var(--shadow-lg);
      text-align: center;
      animation: fade-in-up 0.55s cubic-bezier(0.4, 0, 0.2, 1) both,
                 glow-pulse 4s ease-in-out 0.55s infinite;
    }

    /* ── Staggered children ──────────────────────────────────── */
    .login-icon,
    .form-group,
    .login-error,
    .btn-login,
    .login-back {
      animation: fade-in-up 0.5s cubic-bezier(0.4, 0, 0.2, 1) both;
    }
    .login-icon            { animation-delay: 0.20s; }
    .form-group:nth-of-type(1) { animation-delay: 0.28s; }
    .form-group:nth-of-type(2) { animation-delay: 0.35s; }
    .btn-login             { animation-delay: 0.42s; }
    .login-back            { animation-delay: 0.50s; }

    /* ── Lock icon ───────────────────────────────────────────── */
    .login-icon {
      font-size: 2.5rem;
      line-height: 1;
      margin-bottom: var(--sp-5);
    }

    /* ── Form fields ─────────────────────────────────────────── */
    .form-group {
      margin-bottom: 1.25rem;
      text-align: left;
    }
    .form-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
    }
    .form-group input {
      width: 100%;
      background: var(--bg-secondary);
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 0.95rem;
      padding: 11px 14px;
      transition: border-color var(--t-fast), box-shadow var(--t-fast), background var(--t-fast);
      outline: none;
    }
    .form-group input:focus {
      background: #151f2e;
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.12);
    }
    .form-group input::placeholder { color: var(--text-dim); }

    /* ── Error block ─────────────────────────────────────────── */
    .login-error {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 0.85rem;
      color: var(--red);
      margin-bottom: 1.25rem;
      text-align: left;
      display: none;
    }
    .login-error.visible { display: block; }

    /* ── Submit button ───────────────────────────────────────── */
    .btn-login {
      width: 100%;
      justify-content: center;
      margin-top: 0.5rem;
    }

    /* ── Back link ───────────────────────────────────────────── */
    .login-back {
      display: block;
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .login-back a { color: var(--text-muted); text-decoration: none; }
    .login-back a:hover { color: var(--green); }
  </style>
</head>

      </ul>

        <span class="status-dot" aria-hidden="true"></span>
        Systems Operational

  <main>

    <!-- ── Page Hero ───────────────────────────────────────────── -->
    <section class="page-hero">
      <div class="container">
        <h1>Admin Login</h1>
        <div class="page-cmd">sudo admin --authenticate</div>
      </div>
    </section>

    <!-- ── Login Form ───────────────────────────────────────────── -->
    <div class="login-center">
      <div class="login-card">

        <div class="login-icon" aria-hidden="true">&#128274;</div>

        <div class="login-error" id="login-error" role="alert" aria-live="polite"></div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              autocomplete="current-password"
              required>
          </div>

          <button type="submit" class="btn btn-primary btn-login" id="submit-btn">
            Sign In
          </button>
        </form>

        <div class="login-back">
          <a href="../index.html">&#8592; Back to portfolio</a>
        </div>

      </div>
    </div>

  </main>

  <script src="../config.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="../assets/js/main.js"></script>
